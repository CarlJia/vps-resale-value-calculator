name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Cloudflare 只把「分支名 == 项目 production_branch」的部署当作生产发布，
      # 否则会静默变成 preview：CI 一片绿，线上却停在旧版本。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'vps-value-calculator' }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main | tee deploy.log

      - name: Assert deployment is production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'vps-value-calculator' }}
        run: |
          deployment_id=$(grep -m1 -oE 'Deployment complete.*https://[0-9a-f]+\.' deploy.log \
            | sed -E 's#.*https://([0-9a-f]+)\..*#\1#' || true)
          if [ -z "$deployment_id" ]; then
            echo "::error::无法从 wrangler 输出中解析出部署 ID，无法确认本次部署是否上线"
            tail -n 20 deploy.log
            exit 1
          fi

          response=$(mktemp)
          live=""
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o "$response" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
            if [ "$code" != "200" ] || [ "$(jq -r '.success' "$response")" != "true" ]; then
              echo "::error::查询 Pages 项目失败（HTTP ${code}），无法确认部署环境：$(head -c 300 "$response")"
              exit 1
            fi
            # canonical_deployment 是当前真正服务生产域名的部署，比 latest_deployment 更能锁定「已上线」
            live=$(jq -r '(.result.canonical_deployment // .result.latest_deployment // {})
              | "\(.short_id // "") \(.environment // "")"' "$response")
            [ "$live" = "$deployment_id production" ] && break
            [ "$i" -lt 6 ] && sleep 5
          done

          if [ "$live" != "$deployment_id production" ]; then
            echo "::error::本次部署 ${deployment_id} 没有成为生产版本（当前生产：${live:-未知}），说明它落到了 preview。请确认 Pages 项目的 production_branch 是 main。"
            exit 1
          fi
          echo "✅ 部署 ${deployment_id} 已生效为生产版本"
